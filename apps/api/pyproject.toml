[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aq-edu-uai-api"
version = "0.1.0"
description = "AQ EduUAI phase-1 backend foundation"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.9,<3.0",
    "pydantic-settings>=2.5,<3.0",
    "SQLAlchemy>=2.0.35,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary]>=3.2,<4.0",
    "argon2-cffi>=23.1,<26",
    "cryptography>=44,<47",
    # M4 egress: used directly (not httpx) for the pinned network backend, no proxy
    # environment, no redirects and no retries.
    "httpcore>=1.0.5,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10.0",
    "httpx>=0.27,<1.0",
    "ruff>=0.7,<1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: requires a live PostgreSQL database; opt in with AQ_UAI_RUN_DB_TESTS=1",
    "live_provider: calls a real AI provider (possible charges); skipped unless explicitly authorized",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]
