name: AQ EduUAI quality gates
on:
  push:
    branches: [main]
  pull_request:

jobs:
  baseline-and-python:
    # Pinned: ubuntu-latest moved to 26.04, which Playwright 1.59 cannot install Chromium on.
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_USER: aq_uai_ci
          POSTGRES_PASSWORD: ci_only_test_password
          POSTGRES_DB: aq_uai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aq_uai_ci -d aq_uai_ci"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      AQ_UAI_ENVIRONMENT: test
      AQ_UAI_DB_HOST: localhost
      AQ_UAI_DB_PORT: '5432'
      AQ_UAI_DB_NAME: aq_uai_ci
      AQ_UAI_DB_USER: aq_uai_ci
      AQ_UAI_DB_PASSWORD: ci_only_test_password
      AQ_UAI_RUN_DB_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install API and browser test dependencies
        run: python -m pip install -e './apps/api[dev]' -r tests/browser/requirements.txt
      - name: Install nginx, PostgreSQL client and Chromium
        run: |
          . /etc/os-release
          sudo install -d /etc/apt/keyrings
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo tee /etc/apt/keyrings/postgresql.asc >/dev/null
          printf 'deb [signed-by=/etc/apt/keyrings/postgresql.asc] https://apt.postgresql.org/pub/repos/apt %s-pgdg main\n' "$VERSION_CODENAME" | sudo tee /etc/apt/sources.list.d/aq-postgresql.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y nginx postgresql-client-18
          python -m playwright install --with-deps chromium
      - name: Verify frontend assets, sidebar and JavaScript
        run: |
          python scripts/verify_frontend_assets.py
          for f in apps/web/shared/*.js apps/web/module*/*.js apps/admin/assets/*.mjs; do node --check "$f"; done
          node --test scripts/test_sidebar_navigation.cjs
      - name: Ruff quality check
        run: |
          ruff check apps/api/src apps/api/tests apps/api/migrations/env.py scripts/verify_wp2_compose.py
          ruff check --config apps/api/pyproject.toml tests/browser
      - name: Verify rendered Compose isolation and startup ordering
        run: python scripts/verify_wp2_compose.py --env-file .env.example --project-name aq-wp2-ci
      - name: Apply Alembic migrations to clean PostgreSQL
        run: |
          alembic -c apps/api/alembic.ini upgrade head
          alembic -c apps/api/alembic.ini check
      - name: Run API tests including live PostgreSQL
        run: python -m pytest -q apps/api/tests
      - name: Run real browser, isolated upgrade and restore checks
        env:
          AQ_PHASE2_PG_BIN: /usr/lib/postgresql/18/bin
        run: python -m pytest -q tests/browser
