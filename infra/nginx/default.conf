server {
    listen 80 default_server;
    server_name _;
    access_log off;
    return 404;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location ~ ^/api/v1/(health|ready|system/info)$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        access_log off;
    }

    location = /api { return 404; }
    location /api/ { return 404; }
    location /assets/ { return 404; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name admin.localhost;
    root /usr/share/nginx/admin;
    charset utf-8;
    access_log off;
    error_log /dev/stderr crit;
    client_max_body_size 8k;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location /api/v1/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = / {
        try_files /index.html =404;
    }

    location /assets/ {
        types {
            text/javascript mjs;
            text/css css;
        }
        try_files $uri =404;
    }

    location / { return 404; }
}
